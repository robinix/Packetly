name: Release

# Builds Windows binaries and attaches an install-ready zip to the GitHub
# Release whenever a v* tag is pushed. Publish an update: bump the version,
# commit, tag (e.g. v1.0.1), push the tag - this workflow does the rest.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: dtolnay/rust-toolchain@stable

      - name: Build collector
        run: dotnet publish packetly/src/Packetly -c Release -r win-x64 --self-contained false

      - name: Build UI
        run: cargo build --release --manifest-path packetly-ui/Cargo.toml

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $stage = "Packetly"
          New-Item -ItemType Directory -Path "$stage/scripts" -Force | Out-Null
          $pub = 'packetly/src/Packetly/bin/Release/net8.0-windows/win-x64/publish'
          Get-ChildItem $pub | Copy-Item -Destination $stage -Recurse -Force
          Copy-Item packetly-ui/target/release/packetly-ui.exe $stage/
          Copy-Item assets/packetly.ico $stage/
          Copy-Item scripts/install.ps1 $stage/scripts/
          Copy-Item INSTALL.txt $stage/
          Compress-Archive -Path $stage -DestinationPath "Packetly-$tag-win-x64.zip" -Force
          Get-Item "Packetly-$tag-win-x64.zip" | Select-Object Name, Length

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Packetly-*-win-x64.zip
          generate_release_notes: true
