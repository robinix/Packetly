[package]
name = "gwlite-ui"
version = "0.5.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui_plot = "0.29"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = "0.4"

[profile.release]
opt-level = 2
lto = "thin"
