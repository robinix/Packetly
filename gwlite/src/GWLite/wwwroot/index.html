<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GWLite</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>GWLite</h1>
      <span class="live"><span class="dot" id="live-dot"></span><span id="live-text">connecting…</span></span>
    </div>
    <div class="spacer"></div>
    <div class="ranges" id="ranges">
      <button data-range="5m" class="active">5 min</button>
      <button data-range="3h">3 hours</button>
      <button data-range="24h">24 hours</button>
      <button data-range="30d">30 days</button>
      <button data-range="custom">Custom</button>
      <button data-range="unlimited">All time</button>
    </div>
    <button class="icon-btn" id="refresh-btn" title="Refresh now">⟳</button>
    <button class="icon-btn bell" id="bell-btn" title="Alerts">🔔<span class="badge" id="bell-badge"></span></button>
    <button class="icon-btn" id="theme-btn" title="Toggle theme">◐</button>
  </header>

  <div class="events-panel" id="events-panel" style="display:none">
    <div class="events-head"><b>Alerts</b><button id="events-seen" class="linklike">mark all seen</button></div>
    <div id="events-list" class="events-list"><div class="none">no alerts yet</div></div>
  </div>

  <div class="card">
    <div class="chart-head">
      <h2 style="margin:0">Traffic</h2>
      <span class="chart-title" id="chart-subtitle"></span>
      <span class="filter-chip" id="filter-chip">
        <span class="dot"></span><span id="filter-name"></span>
        <button id="filter-clear" title="Show all apps">✕</button>
      </span>
    </div>
    <div id="custom-panel">
      <label>From <input type="datetime-local" id="custom-from"></label>
      <label>To <input type="datetime-local" id="custom-to"></label>
      <button class="apply" id="custom-apply">Apply</button>
    </div>
    <div id="chart"><div class="empty-note" id="empty-note" style="display:none">no traffic recorded in this range yet</div></div>
  </div>

  <div class="cols">
    <div class="card">
      <h2>Apps</h2>
      <div class="list" id="apps-list"><div class="none">loading…</div></div>
    </div>
    <div class="card">
      <div class="chart-head" style="margin-bottom:4px">
        <h2 style="margin:0">Hosts</h2>
        <span class="spacer"></span>
        <button class="geoip-toggle" id="geoip-toggle" title="Look up host countries. OFF by default — when enabled, remote-host IPs are sent in batches to ip-api.com to resolve country names.">🌍 GeoIP: off</button>
      </div>
      <div class="list" id="hosts-list"><div class="none">loading…</div></div>
    </div>
  </div>

  <div class="card" id="usage-card">
    <div class="usage-head">
      <h2 style="margin:0">Usage &amp; quotas</h2>
      <div class="ranges small" id="usage-periods">
        <button data-p="today" class="active">Today</button>
        <button data-p="week">This week</button>
        <button data-p="month">This month</button>
      </div>
      <span class="chart-title" id="usage-total"></span>
    </div>
    <div id="quota-list" class="quota-list"></div>
    <div class="quota-form">
      <select id="quota-app"><option value="">All apps (global)</option></select>
      <select id="quota-period">
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
      </select>
      <input type="number" id="quota-limit" min="1" step="any" placeholder="Limit">
      <select id="quota-unit">
        <option value="1048576">MB</option>
        <option value="1073741824">GB</option>
      </select>
      <button class="apply" id="quota-add">Set quota</button>
    </div>
    <div class="list" id="usage-bars"><div class="none">loading…</div></div>
  </div>

  <footer>
    <span>collector: <b id="ft-collector">–</b></span>
    <span>events: <b id="ft-events">–</b></span>
    <span>rows: <b id="ft-rows">–</b></span>
    <span>db: <b id="ft-db">–</b></span>
    <span>uptime: <b id="ft-uptime">–</b></span>
  </footer>

</div>

<div id="tooltip"></div>
<script src="uplot.iife.min.js"></script>
<script src="app.js?v=8"></script>
</body>
</html>
